<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그때 이렇게 말할걸!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F6;--surface:#FFFFFF;--ink:#1C1F2A;--muted:#5F6577;--line:#DADDE5;--red:#D7263D;--blue:#2952CC;--red-soft:#FBE3E6;--blue-soft:#E3EAFB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161D;--surface:#1E212B;--ink:#ECEEF3;--muted:#A3A9B8;--line:#333847;--red:#FF5A6E;--blue:#6F92FF;--red-soft:#3A1E24;--blue-soft:#1E2846}}
:root[data-theme="dark"]{--bg:#14161D;--surface:#1E212B;--ink:#ECEEF3;--muted:#A3A9B8;--line:#333847;--red:#FF5A6E;--blue:#6F92FF;--red-soft:#3A1E24;--blue-soft:#1E2846}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-0.03em;margin:8px 0 6px}
h1 .bang{color:var(--red)}
.lede{color:var(--muted);margin:0 0 28px}
h2{font-size:15px;font-weight:700;margin:26px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sits{display:flex;flex-direction:column;gap:8px}
.sit{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.sit[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.sit small{display:block;color:var(--muted);font-size:13px}
textarea,input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{font-size:13px;color:var(--red);margin:8px 0 0;min-height:1em}
.primary{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:16px;margin-top:28px;border:0;border-radius:12px;background:var(--red);color:#fff;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.ghost{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.ring{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0 14px;z-index:2}
.corners{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.corners .me{color:var(--blue)}.corners .them{color:var(--red)}
.tug{position:relative;height:14px;border-radius:7px;background:var(--red);overflow:hidden;margin:6px 0}
.tug .mine{position:absolute;inset:0 auto 0 0;width:50%;background:var(--blue);transition:width .6s ease}
.tug .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--bg)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:12px;margin:14px 0 20px}
.bubble{max-width:88%;padding:12px 15px;border-radius:14px;font-size:16px}
.bubble.them{align-self:flex-start;background:var(--red-soft);border-top-left-radius:4px}
.bubble.me{align-self:flex-end;background:var(--blue-soft);border-top-right-radius:4px}
.bubble .who{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.bubble.them .who{color:var(--red)}.bubble.me .who{color:var(--blue)}
.bubble .tag{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.dock{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.microw{display:flex;align-items:center;gap:14px}
.mic{width:72px;height:72px;flex:none;border-radius:50%;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.mic.on{background:var(--red)}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.07)}}}
.mic:disabled{opacity:.4;cursor:default}
.status{flex:1;font-size:14px;color:var(--muted);min-height:3em}
.status strong{color:var(--ink);font-weight:500}
.countdown{font-weight:700;color:var(--red)}
.typerow{display:flex;gap:8px;margin-top:10px}
.typerow input{flex:1}
.verdict{font-size:44px;font-weight:700;letter-spacing:-0.03em;margin:6px 0 2px}
.verdict.win{color:var(--blue)}.verdict.lose{color:var(--red)}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.score b{display:block;font-size:26px;line-height:1.2}
.score span{font-size:13px;color:var(--muted)}
.redo{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pair .said{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);margin:0 0 8px}
.pair .better{font-size:18px;font-weight:500;margin:0 0 6px}
.pair .better::before{content:"→ ";color:var(--red)}
.pair .why{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:8px;margin-top:20px}
.actions .primary{margin-top:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;vertical-align:-2px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.total{font-size:18px;color:var(--muted);margin:0 0 4px}
.total b{color:var(--ink);font-size:22px}
.growth{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;margin:14px 0 0}
.growth b{font-weight:700}
.pair.worst{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.pair .flag{display:inline-block;font-size:12px;font-weight:700;color:var(--red);margin-bottom:6px}
.pair .pts{float:right;font-size:13px;color:var(--muted)}
.pair .retry{margin-top:10px}
.cmp{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.cmp .now{font-size:16px;font-weight:500;margin:0 0 4px}
.cmp .delta{font-weight:700}
.cmp .delta.up{color:var(--blue)}.cmp .delta.down{color:var(--red)}
.retrybar{font-size:13px;font-weight:700;color:var(--red);margin:4px 0 0}
</style>
</head>
<body>
<main>

<section id="setup">
  <h1>그때 이렇게<br>말할걸<span class="bang">!</span></h1>
  <p class="lede">당했던 그 순간, 이번엔 말로 받아쳐 보세요. 상대가 먼저 말을 걸면 마이크를 누르고 대답하면 됩니다.</p>

  <h2>어디서 생긴 일인가요</h2>
  <div class="chips" id="cats"></div>

  <h2>상황</h2>
  <div class="sits" id="sits"></div>
  <textarea id="custom" rows="3" placeholder="직접 입력: 실제로 있었던 일과 들었던 말을 적어 주세요" class="hidden" style="margin-top:8px"></textarea>

  <h2>상대는 어떤 사람인가요</h2>
  <div class="chips" id="opps"></div>

  <h2>내 목표</h2>
  <div class="chips" id="goals"></div>

  <button class="primary" id="startBtn">말싸움 시작</button>
  <p class="err" id="setupErr" role="alert"></p>
  <p class="note" id="envNote"></p>
  <p class="note">입력한 내용은 AI 처리를 위해 Google Gemini로 전송되며, 서비스 개선에 활용될 수 있어요. 실명이나 개인정보는 적지 마세요.</p>
</section>

<section id="fight" class="hidden" aria-live="polite">
  <div class="ring">
    <div class="corners"><span class="me">나</span><span class="them" id="oppName">상대</span></div>
    <div class="tug" role="meter" aria-label="기세" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" id="tug"><div class="mine" id="tugMine"></div><div class="mid"></div></div>
    <div class="meta"><span id="turnInfo">1 / 5 턴</span><span id="sitShort"></span></div>
    <p class="retrybar hidden" id="retryBar">다시 말하기: 그 순간으로 돌아왔어요</p>
  </div>
  <div class="log" id="log"></div>
  <div class="dock">
    <div class="microw">
      <button class="mic" id="micBtn" disabled>말하기</button>
      <div class="status" id="status"></div>
    </div>
    <div class="typerow">
      <input type="text" id="typeIn" placeholder="말 대신 글로 입력" aria-label="글로 입력">
      <button class="ghost" id="typeBtn">보내기</button>
    </div>
    <p class="err" id="fightErr" role="alert"></p>
  </div>
</section>

<section id="result" class="hidden">
  <p class="note" id="resSit"></p>
  <div class="verdict" id="verdict"></div>
  <p class="total" id="total"></p>
  <p id="headline" style="margin:0"></p>
  <div class="scores" id="scores"></div>
  <div class="growth hidden" id="growth"></div>
  <h2 style="font-size:22px;margin-top:30px">그때 이렇게 말할걸<span style="color:var(--red)">!</span></h2>
  <p class="note" style="margin-top:-4px">아쉬운 순간을 골라 그 장면부터 다시 말해 볼 수 있어요.</p>
  <div class="redo" id="redo"></div>
  <div class="actions">
    <button class="ghost" id="againBtn">같은 상황 처음부터</button>
    <button class="primary" id="newBtn">새 상황</button>
  </div>
</section>

</main>
<script>
const DATA = {
  cats: {
    "직장": [
      {t:"퇴근 10분 전, 팀장이 내일 아침까지 보고서를 새로 써 오라고 한다", role:"팀장"},
      {t:"회의에서 내가 낸 아이디어를 동료가 자기 것처럼 발표했다", role:"동료"},
      {t:"팀장이 다른 팀원들 앞에서 내 실수를 크게 지적한다", role:"팀장"}
    ],
    "가족·친척": [
      {t:"명절에 작은아버지가 결혼은 언제 하냐고 계속 묻는다", role:"작은아버지"},
      {t:"고모가 살 좀 쪘다며 관리 좀 하라고 한다", role:"고모"},
      {t:"친척이 사촌의 연봉과 나를 비교한다", role:"큰어머니"}
    ],
    "손님일 때": [
      {t:"구매 다음 날 환불하러 갔는데 매장이 규정을 이유로 거부한다", role:"매장 직원"},
      {t:"주문과 다른 음식이 나왔는데 직원이 내가 잘못 말했다고 한다", role:"식당 직원"},
      {t:"택배가 파손돼 왔는데 판매자가 책임이 없다고 한다", role:"판매자"}
    ]
  },
  opps: {
    "윽박형": {d:"목소리를 높이고 감정적으로 밀어붙인다", rate:1.15, pitch:0.85},
    "비꼬기형": {d:"웃으면서 돌려 까고 은근히 무시한다", rate:0.92, pitch:1.1},
    "궤변형": {d:"말을 바꾸고 논점을 흐린다", rate:1.05, pitch:1.0},
    "감정호소형": {d:"서운하다, 상처받았다며 역공한다", rate:0.95, pitch:1.2}
  },
  goals: {
    "이기기": {c:["논리","순발력","단호함"], d:"상대의 논리를 깨고 주도권을 가져온다"},
    "선 긋기": {c:["단호함","간결함","침착함"], d:"짧고 분명하게 거절하고 더 끌려가지 않는다"},
    "원만하게": {c:["침착함","존중","명확함"], d:"관계를 지키면서 할 말은 분명히 한다"}
  }
};
// 판정 공식
const MAX_TURNS = 5, LIMIT_SEC = 5, TURN_MAX = 20, HESITATE_PENALTY = 4;
const verdictOf = t => t >= 70 ? "승리" : t >= 40 ? "무승부" : "패배";

const S = {cat:"직장", sit:0, custom:false, opp:"윽박형", goal:"선 긋기", hist:[], turn:0, oppEnd:0, busy:false, mode:"fight", retryIdx:-1, result:null};
let sample = null, rec = null, listening = false, cdTimer = null, voice = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const crit = () => DATA.goals[S.goal].c;

function chipGroup(el, items, key, onPick){
  el.innerHTML = "";
  items.forEach(name => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = name; b.setAttribute("aria-pressed", S[key] === name);
    b.onclick = () => { S[key] = name; [...el.children].forEach(c => c.setAttribute("aria-pressed", c === b)); onPick && onPick(); };
    el.appendChild(b);
  });
}
function renderSits(){
  const el = $("sits"); el.innerHTML = "";
  DATA.cats[S.cat].forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "sit"; b.innerHTML = esc(s.t) + "<small>상대: " + esc(s.role) + "</small>";
    b.setAttribute("aria-pressed", !S.custom && S.sit === i);
    b.onclick = () => { S.sit = i; S.custom = false; $("custom").classList.add("hidden"); renderSits(); };
    el.appendChild(b);
  });
  const c = document.createElement("button");
  c.className = "sit"; c.innerHTML = "실제로 있었던 일 입력<small>들었던 말을 그대로 적으면 그 사람을 재현합니다</small>";
  c.setAttribute("aria-pressed", S.custom);
  c.onclick = () => { S.custom = true; $("custom").classList.remove("hidden"); renderSits(); $("custom").focus(); };
  el.appendChild(c);
}
const sitText = () => S.custom ? $("custom").value.trim() : DATA.cats[S.cat][S.sit].t;
const sitRole = () => S.custom ? "그 상황 속 상대방" : DATA.cats[S.cat][S.sit].role;
const recKey = () => "malhalgeol:" + (S.custom ? "custom:" + sitText().slice(0, 40) : S.cat + "-" + S.sit) + "|" + S.opp + "|" + S.goal;

function pickVoice(){ const vs = speechSynthesis.getVoices(); voice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("ko")) || null; }
function speak(text){
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; if (voice) u.voice = voice;
    const o = DATA.opps[S.opp]; u.rate = o.rate; u.pitch = o.pitch;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
    setTimeout(res, 15000);
  });
}

function setupRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR(); r.lang = "ko-KR"; r.interimResults = true; r.continuous = false;
  let finalText = "";
  r.onstart = () => { listening = true; finalText = ""; $("micBtn").classList.add("on"); $("micBtn").textContent = "듣는 중"; setStatus("<strong>말씀하세요.</strong> 끝나면 자동으로 넘어갑니다."); };
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    setStatus("<strong>" + esc(finalText + interim) + "</strong>");
  };
  r.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") $("fightErr").textContent = "마이크 권한이 막혀 있습니다. 브라우저 설정에서 허용하거나 아래 입력창을 쓰세요.";
    else if (e.error === "no-speech") $("fightErr").textContent = "목소리가 들리지 않았습니다. 다시 눌러 말해 보세요.";
  };
  r.onend = () => {
    listening = false; $("micBtn").classList.remove("on"); $("micBtn").textContent = "말하기";
    const t = finalText.trim();
    if (t) submitLine(t); else if (!S.busy) setStatus("마이크를 눌러 대답하세요.");
  };
  return r;
}

function setStatus(h){ $("status").innerHTML = h; }
function lock(on){ S.busy = on; $("micBtn").disabled = on || !rec; $("typeBtn").disabled = on; }
function addBubble(who, text, tag){
  const d = document.createElement("div");
  d.className = "bubble " + who;
  d.innerHTML = '<span class="who">' + (who === "me" ? "나" : esc(sitRole())) + (tag ? '<span class="tag">' + esc(tag) + "</span>" : "") + "</span>" + esc(text);
  $("log").appendChild(d); d.scrollIntoView({block:"end", behavior:"smooth"});
  return d;
}
function setGauge(pct){
  const v = Math.max(3, Math.min(97, pct));
  $("tugMine").style.width = v + "%"; $("tug").setAttribute("aria-valuenow", Math.round(pct));
}
function myTurns(){ return S.hist.filter(h => h.who === "me"); }
function refreshGauge(){
  const scored = myTurns().filter(h => h.pts != null);
  if (!scored.length) return setGauge(50);
  setGauge(scored.reduce((a, h) => a + h.pts, 0) / (scored.length * TURN_MAX) * 100);
}
function startCountdown(){
  clearInterval(cdTimer);
  S.oppEnd = Date.now();
  let left = LIMIT_SEC;
  const draw = () => setStatus('마이크를 눌러 받아치세요 <span class="countdown">' + left + "</span>");
  draw();
  cdTimer = setInterval(() => { left--; if (left > 0) draw(); else { clearInterval(cdTimer); setStatus("<strong>머뭇거렸어요.</strong> 그래도 지금 대답해 보세요."); } }, 1000);
}

// 채점: 기준별 0~5점 → 턴 점수 0~20, 머뭇거리면 감점
function turnPoints(scores, sec){
  const cs = crit();
  const sum = cs.reduce((a, c) => a + Math.max(0, Math.min(5, Number(scores && scores[c]) || 0)), 0);
  let p = Math.round(sum / (cs.length * 5) * TURN_MAX);
  if (sec > LIMIT_SEC) p -= HESITATE_PENALTY;
  return Math.max(0, p);
}
function cleanScores(scores){ const o = {}; crit().forEach(c => o[c] = Math.max(0, Math.min(5, Number(scores && scores[c]) || 0))); return o; }
function rubric(){
  return "채점 기준 (사용자의 목표: " + S.goal + " — " + DATA.goals[S.goal].d + "). 각 항목 0~5 정수: " + crit().join(", ") +
    ". 0=전혀 못함, 3=무난함, 5=그 상황에서 최선. 말의 내용만 본다(반응 시간은 따로 반영하므로 무시).";
}
function persona(){
  const o = DATA.opps[S.opp];
  return "너는 한국어 말싸움 연습 앱의 상대역이다. 실제 그 사람처럼 연기한다.\n상황: " + sitText() + "\n너의 역할: " + sitRole() +
    "\n성격 유형: " + S.opp + " (" + o.d + ")\n사용자의 목표: " + S.goal +
    "\n규칙: 관계에 맞는 자연스러운 한국어 구어체. 음성으로 읽히니 1~2문장, 50자 이내. 쉽게 물러서지 않는다. 사용자의 말이 효과적이면 조금씩 밀리고, 약하면 더 몰아붙인다. 욕설, 혐오 표현, 위협, 성적 표현 금지. 지문 없이 대사만.";
}
function transcript(upto){ return S.hist.slice(0, upto == null ? S.hist.length : upto).map(h => (h.who === "me" ? "사용자: " : sitRole() + ": ") + h.text).join("\n"); }
const scoreSchema = () => "{" + crit().map(c => '"' + c + '": 0~5').join(", ") + "}";

async function oppTurn(){
  lock(true);
  setStatus('<span class="spin"></span>상대가 할 말을 고르는 중');
  const first = S.hist.length === 0;
  const prompt = persona() + "\n\n" + (first ? "상황을 시작하는 너의 첫 대사를 말해라." :
    "지금까지의 대화:\n" + transcript() + "\n\n1) 사용자의 마지막 말을 채점하고 2) 그 말에 대답해라.\n" + rubric()) +
    '\n\nJSON만 출력: {"reply": "대사"' + (first ? "" : ', "scores": ' + scoreSchema()) + "}";
  try {
    const r = await sample.json(prompt, {modelTier:"quick"});
    if (!first) { const last = S.hist[S.hist.length - 1]; last.scores = cleanScores(r.scores); last.pts = turnPoints(last.scores, last.sec); refreshGauge(); }
    const reply = String(r.reply || "").trim() || "그래서 하고 싶은 말이 뭔데?";
    S.hist.push({who:"them", text:reply});
    addBubble("them", reply);
    setStatus("<strong>상대가 말하는 중</strong>");
    await speak(reply);
    lock(false); startCountdown();
  } catch (e) {
    lock(false);
    $("fightErr").textContent = e && e.code === "rate_limited" ? "요청이 많아 잠시 막혔습니다. 조금 뒤 다시 시도하세요." : "상대 대사를 불러오지 못했습니다. 잠시 뒤 새 상황으로 다시 시작하세요.";
    setStatus("");
  }
}

function submitLine(text){
  if (S.busy) return;
  clearInterval(cdTimer);
  $("fightErr").textContent = "";
  const sec = (Date.now() - S.oppEnd) / 1000;
  const tag = sec > LIMIT_SEC ? "머뭇거림 " + sec.toFixed(1) + "초" : sec.toFixed(1) + "초";
  addBubble("me", text, tag);
  if (S.mode === "retry") return scoreRetry(text, sec);
  S.hist.push({who:"me", text, sec});
  S.turn++;
  $("turnInfo").textContent = Math.min(S.turn + 1, MAX_TURNS) + " / " + MAX_TURNS + " 턴";
  if (S.turn >= MAX_TURNS) finish(); else oppTurn();
}

async function finish(){
  lock(true);
  setStatus('<span class="spin"></span>채점하는 중');
  const prompt = "말싸움 연습을 코치로서 평가해라.\n상황: " + sitText() + "\n상대: " + sitRole() + " (" + S.opp + ")\n\n대화:\n" + transcript() +
    "\n\n" + rubric() + "\n할 일: 1) 사용자의 마지막 발언을 채점한다. 2) 사용자의 발언마다 그 순간 실제로 입 밖에 낼 수 있는 더 나은 한마디(40자 이내)와 한 문장 이유를 쓴다. 3) 전체 한 줄 총평을 친근한 말투로 쓴다.\n" +
    'JSON만 출력: {"last": ' + scoreSchema() + ', "headline": "한 줄 총평", "lines": [{"better": "더 나은 한마디", "why": "한 문장 이유"}]} lines는 사용자 발언 수(' + MAX_TURNS + "개)만큼 순서대로.";
  try {
    const r = await sample.json(prompt, {modelTier:"default"});
    const mine = myTurns();
    const last = mine[mine.length - 1];
    last.scores = cleanScores(r.last); last.pts = turnPoints(last.scores, last.sec);
    mine.forEach((h, i) => { const l = (r.lines || [])[i] || {}; h.better = l.better || ""; h.why = l.why || ""; });
    refreshGauge();
    S.result = {headline: r.headline || ""};
    showResult(true);
  } catch (e) {
    $("fightErr").textContent = "채점을 불러오지 못했습니다. 잠시 뒤 다시 시도하세요.";
    setStatus(""); lock(false);
    S.hist.pop(); S.turn = MAX_TURNS - 1;
  }
}

function summary(){
  const mine = myTurns();
  const total = mine.reduce((a, h) => a + (h.pts || 0), 0);
  const avg = {};
  crit().forEach(c => avg[c] = mine.reduce((a, h) => a + ((h.scores || {})[c] || 0), 0) / mine.length);
  const hes = mine.filter(h => h.sec > LIMIT_SEC).length;
  return {total, avg, hes};
}
function loadRecs(){ try { return JSON.parse(localStorage.getItem(recKey()) || "[]"); } catch (e) { return []; } }
function saveRec(s){ try { const a = loadRecs(); a.push({at:Date.now(), total:s.total, hes:s.hes, avg:s.avg}); localStorage.setItem(recKey(), JSON.stringify(a.slice(-20))); } catch (e) {} }

function showResult(fresh){
  $("fight").classList.add("hidden"); $("result").classList.remove("hidden");
  const s = summary();
  const v = verdictOf(s.total);
  $("resSit").textContent = sitText();
  $("verdict").textContent = v;
  $("verdict").className = "verdict" + (v === "승리" ? " win" : v === "패배" ? " lose" : "");
  $("total").innerHTML = "<b>" + s.total + "</b> / 100점 · 머뭇거림 " + s.hes + "번";
  $("headline").textContent = S.result.headline;
  $("scores").innerHTML = crit().map(c => '<div class="score"><b>' + s.avg[c].toFixed(1) + "</b><span>" + esc(c) + " (5점 만점)</span></div>").join("");
  if (fresh) {
    const prev = loadRecs();
    const g = $("growth");
    if (prev.length) {
      const p = prev[prev.length - 1];
      const d = s.total - p.total;
      const best = crit().map(c => ({c, d:s.avg[c] - (p.avg[c] || 0)})).sort((a, b) => b.d - a.d)[0];
      g.innerHTML = "<b>지난번과 비교</b><br>총점 " + p.total + " → " + s.total + " (" + (d >= 0 ? "+" : "") + d + ") · 머뭇거림 " + p.hes + "번 → " + s.hes + "번" +
        (best && best.d > 0 ? "<br>가장 좋아진 점: " + esc(best.c) + " +" + best.d.toFixed(1) : "");
      g.classList.remove("hidden");
    } else g.classList.add("hidden");
    saveRec(s);
  }
  renderRedo();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderRedo(){
  const mine = myTurns();
  let worst = 0; mine.forEach((h, i) => { if ((h.pts || 0) < (mine[worst].pts || 0)) worst = i; });
  const order = [worst, ...mine.map((_, i) => i).filter(i => i !== worst)];
  $("redo").innerHTML = order.map(i => {
    const h = mine[i];
    const cmp = h.retry ? '<div class="cmp"><p class="now">다시 한 말: ' + esc(h.retry.text) + '</p><span class="delta ' + (h.retry.pts >= h.pts ? "up" : "down") + '">' + h.pts + "점 → " + h.retry.pts + "점</span> · " + esc(h.retry.compare) + "</div>" : "";
    return '<div class="pair' + (i === worst ? " worst" : "") + '">' + (i === worst ? '<span class="flag">가장 아쉬웠던 순간</span>' : "") +
      '<span class="pts">' + (i + 1) + "턴 · " + (h.pts || 0) + "점</span>" +
      '<p class="said">' + esc(h.text) + '</p><p class="better">' + esc(h.better) + '</p><p class="why">' + esc(h.why) + "</p>" + cmp +
      '<button class="ghost retry" data-i="' + i + '">이 순간 다시 말하기</button></div>';
  }).join("");
  $("redo").querySelectorAll(".retry").forEach(b => b.onclick = () => startRetry(Number(b.dataset.i)));
}

async function startRetry(i){
  const mine = myTurns();
  const h = mine[i];
  const idx = S.hist.indexOf(h);
  const oppLine = S.hist[idx - 1];
  S.mode = "retry"; S.retryIdx = i;
  $("result").classList.add("hidden"); $("fight").classList.remove("hidden");
  $("retryBar").classList.remove("hidden");
  $("log").innerHTML = ""; $("fightErr").textContent = "";
  $("turnInfo").textContent = (i + 1) + "턴 다시";
  window.scrollTo({top:0});
  addBubble("them", oppLine.text);
  lock(true); setStatus("<strong>상대가 말하는 중</strong>");
  await speak(oppLine.text);
  lock(false); startCountdown();
}
async function scoreRetry(text, sec){
  lock(true);
  setStatus('<span class="spin"></span>처음 했던 말과 비교하는 중');
  const h = myTurns()[S.retryIdx];
  const idx = S.hist.indexOf(h);
  const prompt = "말싸움 연습 코치로서 같은 순간에 한 두 대답을 비교해라.\n상황: " + sitText() + "\n상대: " + sitRole() + " (" + S.opp + ")\n\n그 순간까지의 대화:\n" + transcript(idx) +
    "\n\n처음 대답: " + h.text + "\n다시 한 대답: " + text + "\n\n" + rubric() + "\n다시 한 대답을 채점하고, 처음보다 무엇이 나아졌거나 아쉬운지 한 문장으로 친근하게 말해라.\n" +
    'JSON만 출력: {"scores": ' + scoreSchema() + ', "compare": "한 문장"}';
  try {
    const r = await sample.json(prompt, {modelTier:"quick"});
    const sc = cleanScores(r.scores);
    h.retry = {text, sec, scores:sc, pts:turnPoints(sc, sec), compare:r.compare || ""};
    S.mode = "fight"; $("retryBar").classList.add("hidden"); lock(false);
    showResult(false);
  } catch (e) {
    lock(false); setStatus("");
    $("fightErr").textContent = "비교 결과를 불러오지 못했습니다. 다시 말해 보세요.";
  }
}

function resetFight(){
  S.hist = []; S.turn = 0; S.busy = false; S.mode = "fight"; S.result = null; setGauge(50);
  $("log").innerHTML = ""; $("fightErr").textContent = ""; $("typeIn").value = "";
  $("retryBar").classList.add("hidden");
  $("turnInfo").textContent = "1 / " + MAX_TURNS + " 턴";
  $("oppName").textContent = sitRole() + " · " + S.opp;
  $("sitShort").textContent = S.goal;
}
function begin(){
  $("setupErr").textContent = "";
    if (S.custom && sitText().length < 5) { $("setupErr").textContent = "있었던 일을 한 줄 이상 적어 주세요."; $("custom").focus(); return; }
  if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
  $("setup").classList.add("hidden"); $("result").classList.add("hidden"); $("fight").classList.remove("hidden");
  resetFight(); window.scrollTo({top:0}); oppTurn();
}

$("startBtn").onclick = begin;
$("againBtn").onclick = begin;
$("newBtn").onclick = () => { $("result").classList.add("hidden"); $("setup").classList.remove("hidden"); window.scrollTo({top:0}); };
$("custom").oninput = () => { $("setupErr").textContent = ""; };
$("micBtn").onclick = () => {
  if (!rec || S.busy) return;
  $("fightErr").textContent = "";
  if (listening) { rec.stop(); return; }
  clearInterval(cdTimer);
  try { rec.start(); } catch (e) {}
};
function sendTyped(){
  const t = $("typeIn").value.trim();
  if (!t) { $("fightErr").textContent = "보낼 말을 먼저 입력하세요."; return; }
  $("typeIn").value = ""; submitLine(t);
}
$("typeBtn").onclick = sendTyped;
$("typeIn").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) sendTyped(); };
$("typeIn").oninput = () => { $("fightErr").textContent = ""; };

chipGroup($("cats"), Object.keys(DATA.cats), "cat", () => { S.sit = 0; S.custom = false; $("custom").classList.add("hidden"); renderSits(); });
renderSits();
chipGroup($("opps"), Object.keys(DATA.opps), "opp");
chipGroup($("goals"), Object.keys(DATA.goals), "goal");

if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
rec = setupRec();
const notes = [];
if (!rec) notes.push("이 브라우저는 음성 인식을 지원하지 않아 글로 입력해야 합니다. 안드로이드는 크롬, 아이폰은 사파리를 권장합니다.");
if (!("speechSynthesis" in window)) notes.push("이 브라우저는 상대 목소리를 재생하지 못합니다.");
$("envNote").textContent = notes.join(" ");

// Gemini 호출 (Cloudflare Worker 경유)
const API_URL = "https://talkfighter.sunju-lee-6v6.workers.dev";
sample = {
  async json(prompt){
    let res;
    try {
      res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({prompt})});
    } catch (e) { const err = new Error("network"); err.code = "network"; throw err; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const err = new Error(data.error || "api"); err.code = res.status === 429 ? "rate_limited" : "api"; console.error("API error", res.status, data); throw err; }
    const clean = String(data.text || "").replace(/```json|```/g, "").trim();
    return JSON.parse(clean);
  }
};
</script>
